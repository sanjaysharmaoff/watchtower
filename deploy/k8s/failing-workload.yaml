# Two deliberately broken workloads in a namespace that matches the Prometheus
# alert labels, so the Kubernetes context provider has real Warning events to find:
# OOMKilling, BackOff, Unhealthy, FailedScheduling.
apiVersion: v1
kind: Namespace
metadata:
  name: checkout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout
  labels:
    app: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        service: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: busybox:1.36
          # `tail /dev/zero` buffers without bound, so the container blows past its
          # 32Mi limit within seconds and the kernel OOM kills it, on repeat. That
          # produces the real OOMKilling / BackOff events the k8s provider reads.
          command:
            - /bin/sh
            - -c
            - |
              echo "starting checkout-api 4.2.1"
              tail /dev/zero
          resources:
            limits:
              memory: "32Mi"
              cpu: "100m"
            requests:
              memory: "16Mi"
              cpu: "50m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: checkout
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        service: payments-api
    spec:
      containers:
        - name: payments-api
          image: busybox:1.36
          # Fails its readiness probe and exits, producing Unhealthy and BackOff.
          command: ["/bin/sh", "-c", "echo 'connection refused dialing payments-db:5432'; sleep 10; exit 1"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
