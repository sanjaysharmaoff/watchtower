name: watchtower

# Full end-to-end stack: real Prometheus rules, real Alertmanager webhook, real Loki
# logs, real pgvector retrieval, real models served locally by Ollama, real SMTP.
#
#   docker compose up --build
#
# Then watch the mail at http://localhost:8025, Prometheus at http://localhost:9090
# and Alertmanager at http://localhost:9093. Alerts fire on their own about 30
# seconds after start, because Prometheus scrapes two targets that do not exist.

services:
  # ---------------------------------------------------------------------------
  # WatchTower
  # ---------------------------------------------------------------------------
  watchtower:
    build:
      context: .
      args:
        VERSION: compose
    ports:
      - "8080:8080"
    environment:
      WT_ENV: dev
      WT_LOG_LEVEL: debug
      WT_LOG_FORMAT: text
      WT_PUBLIC_BASE_URL: http://localhost:8080
      WT_HTTP_AUTH_TOKEN: local-dev-token
      WT_APPROVAL_SECRET: local-dev-approval-secret

      # Storage and retrieval: Postgres with pgvector, partitioned raw table.
      WT_STORE_DRIVER: postgres
      WT_POSTGRES_DSN: postgres://watchtower:watchtower@postgres:5432/watchtower?sslmode=disable
      WT_VECTOR_DRIVER: postgres
      WT_VECTOR_DIMS: "768"          # nomic-embed-text

      # Cognition and embeddings from Ollama's OpenAI-compatible endpoint, so the
      # openai adapter is exercised for real without a cloud key. Point
      # WT_LLM_BASE_URL at api.openai.com and set a real key to switch providers.
      WT_LLM_PROVIDER: openai
      WT_LLM_BASE_URL: http://ollama:11434/v1
      WT_OPENAI_API_KEY: ollama-local
      WT_PLANNER_MODEL: qwen2.5:1.5b
      WT_CRITIC_MODEL: qwen2.5:1.5b
      WT_EMBED_MODEL: nomic-embed-text
      WT_EMBEDDER_DRIVER: openai
      WT_RERANK_DRIVER: llm          # heuristic is free; llm scores each candidate with the model
      WT_LLM_MAX_TOKENS: "800"
      WT_LLM_MAX_ATTEMPTS: "2"
      WT_LLM_CRITIC_ENABLED: "true"
      # CPU inference is slow, so the budgets are generous here.
      WT_LLM_TIMEOUT: 300s
      WT_STAGE_TIMEOUT: 900s
      WT_JOB_TIMEOUT: 20m

      # Enrichment from Loki.
      WT_ENRICH_PROVIDERS: loki
      WT_LOKI_URL: http://loki:3100
      WT_ENRICH_LOOKBACK: 15m
      WT_ENRICH_LOG_LIMIT: "150"
      WT_ENRICH_TIMEOUT: 15s

      # Shared debounce and embedding cache so two replicas would be safe.
      WT_GATE_DRIVER: redis
      WT_CACHE_DRIVER: redis
      WT_REDIS_ADDR: redis:6379
      WT_DEBOUNCE_WINDOW: 5m         # short, so repeat runs are observable

      # Mail to Mailpit: http://localhost:8025
      WT_NOTIFY_DRIVER: smtp
      WT_SMTP_HOST: mailpit
      WT_SMTP_PORT: "1025"
      WT_SMTP_TLS: "false"
      WT_MAIL_FROM: watchtower@example.com
      WT_MAIL_TO: sre@example.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      loki:
        condition: service_started
      mailpit:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower -d watchtower"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # Models (CPU inference, no API key required)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: pulls the planner and embedding models, then exits. WatchTower waits
  # for it, so the first incident never races a cold model store.
  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 3; done;
        ollama pull qwen2.5:1.5b &&
        ollama pull nomic-embed-text &&
        echo "models ready"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

  # ---------------------------------------------------------------------------
  # Telemetry sources
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  # Stands in for the failing application: pushes realistic log lines to Loki.
  log-pusher:
    image: python:3.11-alpine
    command: ["python", "/app/push_logs.py"]
    environment:
      LOKI_URL: http://loki:3100
      INTERVAL_SECONDS: "5"
    volumes:
      - ./deploy/logs/push_logs.py:/app/push_logs.py:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mail
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  ollama:
